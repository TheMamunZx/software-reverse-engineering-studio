name: Package Validation & Hygiene Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-packages:
    name: Package Hygiene & Clean Install Audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 20.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm run build

      - name: Run packaging and clean installation audit
        run: node scripts/pack-audit.mjs

